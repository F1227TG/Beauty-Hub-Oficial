name: Beauty Hub quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:database
      - run: npm run check:google
      - run: npm run check:captcha
      - run: npm run check:operations
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beauty-validation
          path: test-results/
