name: Recover Beauty Hub production assets

on:
  push:
    paths:
      - ".github/workflows/recover-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovered repository
        uses: actions/checkout@v4

      - name: Download binary assets still available in production
        shell: bash
        run: |
          set -euo pipefail
          base="https://beautyhuboficial.vercel.app/assets/images"
          mkdir -p assets/images
          for file in             beauty-hero-desktop.webp             category-hair.webp             category-nails.webp             category-brows.webp             category-makeup.webp             beauty-salon-cover.webp             beauty-auth-panel.webp
          do
            curl --fail --location --retry 3 --output "assets/images/$file" "$base/$file"
          done
          file assets/images/*

      - name: Commit recovered binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Recover Beauty Hub binary assets from production"
          git push
